        color: white;
        text-decoration: none;

      }

      }

      .resume-container {
        margin-top: 0px;

      }

      .resume-container img {
        max-width: 900px;
        width: 90%;

        display: inline-block;
        margin-top: 30px;
        padding: 12px 25px;
        border: 1px solid white;
        color: white;
