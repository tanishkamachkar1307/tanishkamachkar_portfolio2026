<!DOCTYPE html>

<style>

/* RESET */

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
scroll-behavior:smooth;
background:black;

cursor:none;
}
a, button, img, video{
cursor:none;
}

/* cursor */
.cursor{
width:40px;
height:40px;

position:fixed;
pointer-events:none;

background:url("brush.png") center/contain no-repeat;

transform:translate(-50%,-50%);

z-index:99999;
}

/* NAVBAR */

.navbar{
position:fixed;
top:0;
left:0;
width:100%;
background:black;
display:flex;
justify-content:center;
gap:60px;
padding:20px 0;
z-index:1000;
}

.navbar a{
color:white;
text-decoration:none;
font-size:18px;
letter-spacing:1px;
}

.navbar a:hover{
opacity:0.7;
}

/* SECTIONS */

.slide{
width:100%;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding-top:80px;
box-sizing:border-box;
position:relative;
}

/* IMAGE FIT */

.slide img{
max-width:100%;
max-height:100%;
object-fit:contain;
display:block;
}

/* OVERLAP EFFECT */

.overlap{
position:sticky;
top:0;
background:black;
}

/* BACK TO TOP BUTTON */

#topBtn{
position:fixed;
bottom:30px;
right:30px;
z-index:2000;
display:none;
}

#topBtn img{
width:50px;
height:auto;
cursor:pointer;
transition:0.3s ease;
}

#topBtn img:hover{
transform: scale(1.2);
}

/* FOOTER */

.footer{
background:#111;
color:white;
text-align:center;

padding:20px 10px;

border-top:1px solid #444;

/* force footer above sticky sections */
position:relative;
z-index:9999;
}
.footer a,
.footer h2{
color:white;
}

/* footer text */

.footer h2{
margin:5px 0 10px 0;
font-size:18px;
color:white;
}

.footer a{
color:white;
text-decoration:none;
font-size:14px;
}

.footer a:hover{
opacity:0.7;
}
/* CONTACT */

.contact-row{
display:flex;
justify-content:center;
gap:40px;
flex-wrap:wrap;
margin-top:20px;
}

.contact-item{
display:flex;
align-items:center;
gap:10px;
}

.contact-item img{
width:22px;
height:22px;
}

/* FOLDER */

.folder-area{
position:absolute;
right:10%;
bottom:15%;
width:500px;
height:450px;
}

/* FOLDER PARTS */

.yellow-folder-back{
position:absolute;
width:460px;
height:250px;
background:#d4a11f;
border-radius:15px;
bottom:120px;
z-index:1;
}

.yellow-tab{
position:absolute;
width:180px;
height:30px;
background:#d4a11f;
border-radius:10px 10px 0 0;
left:50px;
bottom:360px;
z-index:1;
}

/* FILE CARDS */

.gray-file{
position:absolute;
width:400px;
height:200px;
border-radius:10px;
z-index:2;
overflow:hidden;
transition:transform 0.3s ease, box-shadow 0.3s ease;
}

.gray-file img{
width:100%;
height:100%;
object-fit:cover;
border-radius:10px;
}

.gray-file:hover{
transform:translateY(-150px);
cursor:pointer;
box-shadow:0 25px 50px rgba(0,0,0,0.4);
}

/* FILE STACK POSITIONS */

.gray-file-1{ left:10px; bottom:150px; }
.gray-file-2{ left:20px; bottom:140px; }
.gray-file-3{ left:30px; bottom:130px; }
.gray-file-4{ left:40px; bottom:120px; }
.gray-file-5{ left:50px; bottom:110px; }

.yellow-file-front{
position:absolute;
width:470px;
height:200px;
background:#d4a11f;
border-radius:15px;
bottom:60px;
z-index:2;
}

/* SOFTWARE STACK */

.software-stack{
position:absolute;

/* move it right and slightly lower */
right:15%;
top:60%;

/* remove vertical centering */
transform:none;

width:340px;
height:240px;
}
/* card */

.software-card{
position:absolute;

width:220px;
height:220px;

border-radius:28px;
overflow:hidden;

transition:all 0.35s ease;
}

.software-card img{
width:100%;
height:100%;
object-fit:cover;
}

/* stack positions */

.pos1{ transform:translate(0px,0px); z-index:8; filter:blur(0); }
.pos2{ transform:translate(-35px,5px); z-index:7; filter:blur(1px); }
.pos3{ transform:translate(-70px,10px); z-index:6; filter:blur(2px); }
.pos4{ transform:translate(-105px,15px); z-index:5; filter:blur(3px); }
.pos5{ transform:translate(-140px,20px); z-index:4; filter:blur(4px); }
.pos6{ transform:translate(-175px,25px); z-index:3; filter:blur(5px); }
.pos7{ transform:translate(-210px,30px); z-index:2; filter:blur(6px); }
.pos8{ transform:translate(-245px,35px); z-index:1; filter:blur(7px); }

/* PAINTING SLIDER */

.painting-slider
{
position:absolute;
right:15%;
top:55%;
transform:translateY(-50%);

display:flex;
align-items:center;
gap:20px;
}

.painting-container{
width:300px;
height:400px;
position:relative;
border-radius: 20px;
margin-top: 10px;

}

.painting{
position:absolute;
top:0;
left:0;

width:100%;
height:100%;

object-fit:contain;


opacity:0;
transition:opacity 0.4s ease;
}

.painting.active{
opacity:1;
}

.arrow{
background:none;
border:none;

color:white;
font-size:40px;
cursor:pointer;
}

.arrow:hover{
opacity:0.6;
}

/* NAUVARI SLIDER */
.carousel{
position:absolute;

top:55%;
left:50%;

transform:translate(-50%,-50%);

width:85%;
overflow:visible;   /* changed from hidden so enlarged images aren't cut */
}

.carousel-track{
display:flex;
gap:40px;

transition:transform 0.5s ease;
}

.carousel-track img{

width:420px;
height:450px;

object-fit:cover;

border-radius:20px;

transition:transform 0.35s ease;

position:relative;   /* allows z-index to work */

}

.carousel-track img:hover{

transform:scale(1.10);   /* bigger expansion */

z-index:50;

}

/* BHIMTHADI MERCH */
.merch-section{

display:flex;
align-items:center;
justify-content:center;

gap:50px;

position:absolute;
top:55%;
left:50%;
transform:translate(-50%,-50%);

}

/* VIDEO */

.merch-video video{

width:350px;
height:520px;

object-fit:cover;

}

/* SLIDER */

.merch-slider{

display:flex;
align-items:center;
gap:20px;

}

.merch-container{

width:350px;
height:520px;

position:relative;

}

.merch{

position:absolute;

top:0;
left:0;

width:100%;
height:100%;

object-fit:contain;

opacity:0;

transition:opacity .4s ease;

}

.merch.active{
opacity:1;
}

/* ARROWS */

.arrow{

background:none;
border:none;

color:white;

font-size:40px;

cursor:pointer;

}

.arrow:hover{
opacity:0.7;
}

/* KURLA RUN */
.video-only{
position:absolute;

top:55%;
left:40%;

transform:translate(-50%, -50%);
}
.video-only{
position:absolute;

top:55%;
left:50%;

transform:translate(-50%,-50%);

display:flex;
align-items:center;
gap:60px;
}

/* side characters */

.side{
width:120px;
animation: floatMove 2.5s ease-in-out infinite;
}

/* slightly different timing for natural motion */

.student{
animation-delay:0.5s;
}

/* floating animation */

@keyframes floatMove{

0%{
transform:translateY(0px);
}

50%{
transform:translateY(-50px);
}

100%{
transform:translateY(0px);
}

}

.video-only video{
width:350px;
height:600px;

object-fit:cover;
}

/* GLOSSARY */
.glossary-slider{

position:absolute;
top:55%;
left:50%;
transform:translate(-50%, -50%);

display:flex;
align-items:center;
gap:20px;

}

.glossary-container{

width:500px;
height:650px;

position:relative;

}

.glossary{

position:absolute;
top:0;
left:0;

width:100%;
height:100%;

object-fit:contain;

opacity:0;
transition:opacity .4s ease;

}

.glossary.active{
opacity:1;
}

/* arrows */

.glossary-arrow{

background:none;
border:none;

color:white;
font-size:40px;

cursor:pointer;

}

.glossary-arrow:hover{
opacity:0.7;
}

/* ARTWORKS */
.artworks-carousel{

width:100%;
overflow:visible;   /* changed from hidden so enlarged images aren't cut */

margin:120px 0;

}

.artworks-track{

display:flex;
gap:40px;

animation: artworksScroll 25s linear infinite;

}

.artworks-carousel:hover .artworks-track{

animation-play-state: paused;

}

.artworks-track img{

width:420px;
height:260px;

object-fit:cover;

border-radius:20px;

transition:transform .35s ease;

position:relative;   /* allows z-index to work */

}

.artworks-track img:hover{

transform:scale(1.35);   /* bigger expansion */

z-index:50;

}

@keyframes artworksScroll{

0%{
transform:translateX(0);
}

100%{
transform:translateX(-50%);
}

}

.spacer{
height:60vh;
background:black;
padding-top:5px;
padding-bottom:5px;
}

/* maya video */
video{
border-radius:20px;
}
video:hover{
transform:scale(1.05);

}
.video-layout{

position:absolute;

top:60%;

/* left vertical */

}

/* center horizontal */

width:420px;
height:420px;

object-fit:cover;

}

/* right vertical */

.video-right video{

width:220px;
height:420px;

object-fit:cover;

}

</style>

<script>

const stack = document.getElementById("softwareStack");

setInterval(() => {

let cards = stack.children;

for(let i=0;i<cards.length;i++){
cards[i].classList.remove(
"pos1","pos2","pos3","pos4","pos5","pos6","pos7","pos8"
);
}

cards[0].classList.add("pos8");
cards[1].classList.add("pos1");
cards[2].classList.add("pos2");
cards[3].classList.add("pos3");
cards[4].classList.add("pos4");
cards[5].classList.add("pos5");
cards[6].classList.add("pos6");
cards[7].classList.add("pos7");

stack.appendChild(cards[0]);

}, 900);

/* PAINTING SLIDER */
let currentPainting = 0;

function nextPainting(){

const paintings = document.querySelectorAll(".painting");

paintings[currentPainting].classList.remove("active");

currentPainting++;

if(currentPainting >= paintings.length){
currentPainting = 0;
}

paintings[currentPainting].classList.add("active");

}

function prevPainting(){

const paintings = document.querySelectorAll(".painting");

paintings[currentPainting].classList.remove("active");

currentPainting--;

if(currentPainting < 0){
currentPainting = paintings.length - 1;
}

paintings[currentPainting].classList.add("active");

}
</script>

<!-- CONTACT FOOTER -->
 <script>

document.addEventListener("DOMContentLoaded", function(){

const track = document.querySelector(".carousel-track");

let position = 0;
let speed = 0.4;
let paused = false;

function animateCarousel(){

if(!paused){
position -= speed;
track.style.transform = `translateX(${position}px)`;
}

requestAnimationFrame(animateCarousel);

}

animateCarousel();

/* pause when hovered */

track.addEventListener("mouseenter", function(){
paused = true;
});

track.addEventListener("mouseleave", function(){
paused = false;
});

});

</script>
